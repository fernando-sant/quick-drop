<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>drop</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --border: #262b35;
    --text: #e6e8eb;
    --muted: #8a919e;
    --accent: #5fd4a0;
    --accent-dim: #2e5c48;
    --danger: #e0685a;
    --mono: "SFMono-Regular", "IBM Plex Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--accent);
  }
  h1::before { content: "$ "; color: var(--muted); }
  .repo-tag {
    color: var(--muted);
    font-size: 12px;
  }
  .status {
    margin: 16px 0 28px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  button.refresh {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  button.refresh:hover { border-color: var(--accent); color: var(--accent); }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 32px 0 10px;
  }

  .item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .fname {
    color: var(--text);
    word-break: break-all;
    font-size: 13.5px;
  }
  .fmeta {
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
  }
  a.dl, button.copy {
    flex-shrink: 0;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    padding: 6px 12px;
    border-radius: 4px;
    text-decoration: none;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
  }
  a.dl:hover, button.copy:hover { border-color: var(--accent); }
  button.copy.copied { background: var(--accent); color: #0f1115; }

  pre.code-body {
    margin: 12px 0 0;
    padding: 12px;
    background: #0b0d11;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12.5px;
    color: #c9cdd4;
    max-height: 260px;
    overflow-y: auto;
  }

  .empty, .error {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
  }
  .error { color: var(--danger); }

  footer {
    margin-top: 60px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
  }
  footer code {
    background: var(--panel);
    padding: 1px 5px;
    border-radius: 3px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>drop</h1>
    <span class="repo-tag" id="repoTag">loading…</span>
  </header>

  <div class="status">
    <span class="dot"></span>
    <span id="statusText">checking repo…</span>
    <button class="refresh" id="refreshBtn">refresh</button>
  </div>

  <div id="content">
    <div class="empty">loading…</div>
  </div>

  <footer>
    edit <code>OWNER</code> / <code>REPO</code> / <code>BRANCH</code> / <code>PATH</code> at the top of the script in this file to point it at your repo.
    text files (.txt .md .json .yaml .yml .csv .log) render inline with a copy button — everything else gets a download link.
  </footer>
</div>

<script>
  // ---- CONFIGURE THIS ----
  const OWNER  = "YOUR_GITHUB_USERNAME";
  const REPO   = "YOUR_REPO_NAME";
  const BRANCH = "main";
  const PATH   = "";   // e.g. "drop" if you keep files in a /drop subfolder, else ""
  // -------------------------

  const TEXT_EXT = ["txt","md","json","yaml","yml","csv","log","conf","ini"];

  const contentEl = document.getElementById("content");
  const statusEl = document.getElementById("statusText");
  const repoTagEl = document.getElementById("repoTag");
  repoTagEl.textContent = `${OWNER}/${REPO}${PATH ? "/" + PATH : ""}`;

  function ext(name) {
    const parts = name.split(".");
    return parts.length > 1 ? parts.pop().toLowerCase() : "";
  }

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    const original = btn.textContent;
    btn.textContent = "copied";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = original; btn.classList.remove("copied"); }, 1200);
  }

  async function load() {
    statusEl.textContent = "checking repo…";
    contentEl.innerHTML = '<div class="empty">loading…</div>';
    const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=${BRANCH}`;

    try {
      const res = await fetch(apiUrl, { headers: { "Accept": "application/vnd.github+json" } });
      if (!res.ok) {
        if (res.status === 404) throw new Error("repo or path not found — check OWNER/REPO/PATH in the script");
        if (res.status === 403) throw new Error("rate limited by GitHub API — wait a bit and refresh");
        throw new Error(`GitHub API error (${res.status})`);
      }
      const items = await res.json();
      const files = Array.isArray(items) ? items.filter(i => i.type === "file") : [];

      if (files.length === 0) {
        statusEl.textContent = "connected — no files yet";
        contentEl.innerHTML = '<div class="empty">nothing dropped yet. add a file to the repo from your phone and hit refresh.</div>';
        return;
      }

      files.sort((a, b) => a.name.localeCompare(b.name));
      statusEl.textContent = `connected — ${files.length} file${files.length === 1 ? "" : "s"}`;

      const blocks = await Promise.all(files.map(async (f) => {
        const isText = TEXT_EXT.includes(ext(f.name));
        const rawUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${f.path}`;

        if (isText && f.size < 200000) {
          let body = "";
          try {
            const r = await fetch(rawUrl);
            body = await r.text();
          } catch {
            body = "(could not load file content)";
          }
          const id = "t" + Math.random().toString(36).slice(2);
          return `
            <div class="item">
              <div class="item-row">
                <div>
                  <div class="fname">${escapeHtml(f.name)}</div>
                  <div class="fmeta">${fmtSize(f.size)}</div>
                </div>
                <button class="copy" data-target="${id}">copy</button>
              </div>
              <pre class="code-body" id="${id}">${escapeHtml(body)}</pre>
            </div>`;
        } else {
          return `
            <div class="item">
              <div class="item-row">
                <div>
                  <div class="fname">${escapeHtml(f.name)}</div>
                  <div class="fmeta">${fmtSize(f.size)}</div>
                </div>
                <a class="dl" href="${rawUrl}" download="${escapeHtml(f.name)}">download</a>
              </div>
            </div>`;
        }
      }));

      contentEl.innerHTML = blocks.join("");

      contentEl.querySelectorAll("button.copy").forEach(btn => {
        btn.addEventListener("click", () => {
          const pre = document.getElementById(btn.dataset.target);
          copyText(pre.textContent, btn);
        });
      });

    } catch (err) {
      statusEl.textContent = "error";
      contentEl.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  document.getElementById("refreshBtn").addEventListener("click", load);
  load();
</script>
</body>
</html>
